name: Snapshot

# 毎日、締め切りを迎えた対戦を集計して、部品をリリースに上げ、目次を snapshots/ に積む（docs/adr/0011）。
# アプリはスナップショットを GitHub Pages から読むので、積んだあとに配信し直す
on:
  schedule:
    - cron: '0 20 * * *' # 05:00 JST
  workflow_dispatch:

permissions:
  # 目次のコミットと、部品のリリース
  contents: write
  # 積んだあとに、スナップショット・選手ページ・公開 API を配信し直すため、配信のワークフローを起動する
  actions: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    # 手で起動するときに別のブランチを選んでも、そのブランチには積まない
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # シーズンが終わった日は最終スナップショットだけが書かれる。新しいシーズンの最初の分は翌日に作る。
      # その間にだけ、レート計算に関わる設定を変えられる（docs/spec.md「スナップショット」）
      # 前回の部品は、手元に無ければリリースから取る
      - id: snapshot
        # ゲームが1つ失敗しても、書けたゲームの分は上げてコミットし、最後の段で失敗にする
        continue-on-error: true
        run: npm run snapshot -- --cutoff "$(date +%s)"
        env:
          SNAPSHOT_RELEASE_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/
      # 目次が指す部品が無い時間を作らないよう、部品を先にリリースへ上げてから目次を積む
      - name: Upload parts
        env:
          GH_TOKEN: ${{ github.token }}
        # Immutable releases を有効にしているので、公開したリリースには添付を足せない。
        # gh release create にファイルを渡し、下書きで作って添付してから公開する
        run: |
          shopt -s nullglob
          # 同じ日にもう一度動かすと、目次のパスが同じなのでタグも同じになる。前の実行がリリースを公開してから
          # 目次を積めずに止まっていると、そのリリースに部品を足せない。先に全部を確かめ、足せないときは何も上げずに止める。
          # 翌日の実行は新しいタグになるので、そこから続く
          pending=()
          for dir in .snapshot-parts/upload/*/; do
            tag=$(basename "$dir")
            files=("$dir"*.json)
            if [ ${#files[@]} -eq 0 ]; then continue; fi
            state=$(gh release view "$tag" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)
            if [ "$state" = published ]; then
              # 部品の名前は sha256 なので、名前がそろっていれば中身も同じ
              have=$(gh release view "$tag" --json assets --jq '.assets[].name')
              for f in "${files[@]}"; do
                if ! grep -qxF "$(basename "$f")" <<<"$have"; then
                  echo "::error::${tag} は公開済みで、部品 $(basename "$f") を足せません。今日の分は積まず、明日の実行で新しいタグに作ります"
                  exit 1
                fi
              done
              continue
            fi
            pending+=("$dir")
          done
          for dir in "${pending[@]}"; do
            tag=$(basename "$dir")
            # 前の実行が添付の途中で止まった下書きは、消して作り直す
            if gh release view "$tag" >/dev/null 2>&1; then gh release delete "$tag" --yes; fi
            gh release create "$tag" "$dir"*.json --title "$tag" --notes "スナップショットの部品（docs/adr/0011）" --target "${GITHUB_SHA}" --latest=false
          done
      - name: Commit
        run: |
          git add snapshots
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "snapshot: $(date -u +%Y-%m-%dT%H:%MZ)"
          # 集計の間にほかのコミットが積まれていても push できるように、その上に載せ直す
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fail if a game failed
        if: steps.snapshot.outcome == 'failure'
        run: |
          echo "スナップショットを作れなかったゲームがあります。上の snapshot の段のログを見てください。"
          exit 1
