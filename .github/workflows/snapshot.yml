name: Snapshot

# 毎日、締め切りを迎えた対戦を集計して snapshots/ に積む。
# アプリはスナップショットを raw.githubusercontent.com から読むので、配信し直す必要はない
on:
  schedule:
    - cron: '0 20 * * *' # 05:00 JST
  workflow_dispatch:

permissions:
  contents: write
  # 積んだあとに、選手ページと公開 API を作り直すため配信のワークフローを起動する
  actions: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    # 手で起動するときに別のブランチを選んでも、そのブランチには積まない
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # シーズンが終わった日は最終スナップショットだけが書かれる。新しいシーズンの最初の分は翌日に作る。
      # その間にだけ、レート計算に関わる設定を変えられる（docs/protocol.md「スナップショット」）
      - run: npm run snapshot -- --cutoff "$(date +%s)"
      - name: Commit
        run: |
          git add snapshots
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "snapshot: $(date -u +%Y-%m-%dT%H:%MZ)"
          # 集計の間にほかのコミットが積まれていても push できるように、その上に載せ直す
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
