name: Deploy to GitHub Pages

# 配信する JS は、このワークフローのビルドだけから作る（README「既知の限界」の鍵の扱いを参照）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # 復活の道具の入手先は、一番新しい recovery-v* のリリースのページにする。まだ無ければアプリはリリースの一覧を指す
      - id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "${{ github.repository }}" --limit 100 --exclude-drafts --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("recovery-v"))] | sort_by(.publishedAt) | last | .tagName // ""')
          echo "url=${tag:+https://github.com/${{ github.repository }}/releases/tag/${tag}}" >> "$GITHUB_OUTPUT"
      - run: npm -w @nostr-rating/web run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SNAPSHOT_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main/
          VITE_REPO_URL: https://github.com/${{ github.repository }}
          VITE_RECOVERY_URL: ${{ steps.recovery.outputs.url }}
      # 最新のスナップショットから、選手ページ（p/）と公開 API（api/v1/）を書き出す（docs/api.md）
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run site -- --out apps/web/dist --app-url "${{ steps.pages.outputs.base_url }}/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
