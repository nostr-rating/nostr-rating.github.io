name: Deploy to GitHub Pages

# 配信する JS は、このワークフローのビルドだけから作る（README「既知の限界」の鍵の扱いを参照）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # 復活の道具の入手先は、一番新しい recovery-v* のリリースのページにする。まだ無ければアプリはリリースの一覧を指す。
      # スナップショットの部品のリリースが毎日増えるので、リリースの一覧ではなくタグから探す
      # タグを push してからリリースが公開されるまでの間や、下書きのリリースは使わない
      - id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=
          for tag in $(git ls-remote --tags --refs --sort=-v:refname origin 'refs/tags/recovery-v*' | sed 's#.*refs/tags/##'); do
            if [ "$(gh release view "$tag" --repo "${{ github.repository }}" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
              url="https://github.com/${{ github.repository }}/releases/tag/${tag}"
              break
            fi
          done
          echo "url=${url}" >> "$GITHUB_OUTPUT"
      # 配信の基準パスは、リポジトリ名が <owner>.github.io なら / 、それ以外は /<リポジトリ名>/ になる
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm -w @nostr-rating/web run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_REPO_URL: https://github.com/${{ github.repository }}
          VITE_RECOVERY_URL: ${{ steps.recovery.outputs.url }}
      # 最新のスナップショットから、アプリが読むスナップショット（snapshots/、docs/adr/0011）、
      # 選手ページ（p/）、公開 API（api/v1/、docs/api.md）を書き出す。部品はリリースから取る
      # 紐づけの確認の結果は、前回の配信のものを使い回す（GitHub の API の回数の上限に当たらないように）
      - run: npm run site -- --out apps/web/dist --app-url "${{ steps.pages.outputs.base_url }}/" --claims-cache "${{ steps.pages.outputs.base_url }}/api/v1/claims.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_RELEASE_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
